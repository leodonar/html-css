<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: lightpink;
            text-align: center;
            display: flex;
            flex-flow: row nowrap;

        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">Outro conteúdo</div>
        <div class="item">D</div>
        <div class="item">Conteúdo muito maior que o outro</div>
        <div class="item">F</div>
        <div class="item">Um grande conteúdo para teste de capacidade no elemento</div>
    </div>
    
</body>
</html>
